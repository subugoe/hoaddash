        text: "GitHub Dashboard Repo"
      - icon: "file-bar-graph"
        href: https://github.com/subugoe/hoaddata
        text: "GitHub Data Repo"
      - icon: "bug"
        text: "Report a Bug"
        href: https://github.com/subugoe/hoaddash/issues
    style: "docked"
    search: true
    collapse-level: 1
