project:
  type: website
  title: "HOAD Dashboard"
  output-dir: docs
  resources:
    - fonts/*
  execute-dir: project

website:
  title: "HOAD"
  site-url: https://subugoe.github.io/hoaddash/
  twitter-card: true
  open-graph: true
  page-footer:
